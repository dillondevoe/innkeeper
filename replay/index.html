<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Innkeeper — recorded quest replay</title>
<style>
  :root { --bg: #0b0d10; --fg: #d8dee4; --dim: #6b7380; --accent: #58d68d; }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    display: flex; flex-direction: column; align-items: center; padding: 24px 16px;
  }
  h1 { font-size: 15px; color: var(--dim); font-weight: 400; margin: 0 0 14px; }
  h1 code { color: var(--accent); }
  #term {
    width: 100%; max-width: 760px; min-height: 420px; background: #000;
    border: 1px solid #22262c; border-radius: 8px; padding: 18px 20px;
    white-space: pre-wrap; font-size: 13px; line-height: 1.55; overflow-y: auto;
  }
  #term strong { color: var(--accent); font-weight: 600; }
  #controls { margin-top: 14px; display: flex; gap: 10px; }
  button {
    background: #1b1f26; color: var(--fg); border: 1px solid #2c313a; border-radius: 6px;
    padding: 7px 16px; font-family: inherit; font-size: 13px; cursor: pointer;
  }
  button:hover { background: #262b33; }
  button:disabled { opacity: 0.4; cursor: default; }
  #caption { margin-top: 10px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<h1>Recorded quest &mdash; a canned run of <code>bin/hello-party.sh</code>, replayed at its own pace. No model call, no login, no cost.</h1>
<div id="term"></div>
<div id="controls">
  <button id="playBtn">Play</button>
  <button id="restartBtn">Restart</button>
</div>
<div id="caption">0 / 0 lines</div>
<script>
const EVENTS = [{"t": 0.22, "html": ""}, {"t": 0.22, "html": "<strong>0. A tool that needs a version flag</strong>"}, {"t": 0.24, "html": "   work repo: $TMPDIR/hello-party.SANDBOX/work  (a real git repo, inside the sandbox)"}, {"t": 0.24, "html": "   today it answers: hello, tavern"}, {"t": 0.24, "html": "   and --version:   [hello, tavern]  &lt;- it ignores the flag entirely. That is the job."}, {"t": 0.24, "html": ""}, {"t": 0.24, "html": "<strong>1. The quest is posted</strong>"}, {"t": 0.28, "html": "   version-flag: state=open"}, {"t": 0.28, "html": ""}, {"t": 0.28, "html": "<strong>2. A worker claims it -- under a lease, so a second one would stand down</strong>"}, {"t": 0.3, "html": "   lease: CLAIMED 00000000-0000-0000-0000-000000000000"}, {"t": 0.32, "html": "   a second instance of the same worker stands down: HELD-BY-OTHER age=N"}, {"t": 0.43, "html": "   version-flag: state=claimed lane=worker"}, {"t": 0.43, "html": ""}, {"t": 0.43, "html": "<strong>3. The researcher reads the tool and briefs the worker</strong>"}, {"t": 0.44, "html": "   researcher: the tool declares NO version anywhere. A --version flag therefore needs two"}, {"t": 0.44, "html": "   things, not one: a version value to print, and a branch that prints it. A flag added"}, {"t": 0.44, "html": "   without the value prints an empty line and still exits 0, which looks like success."}, {"t": 0.44, "html": ""}, {"t": 0.44, "html": "<strong>4. The worker does the work -- attempt 1</strong>"}, {"t": 0.45, "html": "   commit SHA: add a --version flag"}, {"t": 0.45, "html": ""}, {"t": 0.45, "html": "<strong>5. The gate checks it -- by RUNNING the tool, not by reading the diff</strong>"}, {"t": 0.46, "html": "   NO `tool.sh --version` exited 0 but printed NOTHING. The flag is wired up and has"}, {"t": 0.46, "html": "      no value to print, so it succeeds while telling the user nothing. Give it a"}, {"t": 0.46, "html": "      version string and print that."}, {"t": 0.46, "html": "   -&gt; REFUSED. This is the step the whole quest exists to show."}, {"t": 0.46, "html": ""}, {"t": 0.46, "html": "<strong>6. The worker reads the refusal and fixes it -- attempt 2</strong>"}, {"t": 0.48, "html": "   commit SHA: give --version a version to print (gate refused: it printed nothing)"}, {"t": 0.48, "html": ""}, {"t": 0.48, "html": "<strong>7. The gate checks again</strong>"}, {"t": 0.49, "html": "   PASS `tool.sh --version` prints: 0.1.0"}, {"t": 0.49, "html": ""}, {"t": 0.49, "html": "<strong>8. The result merges -- exactly once</strong>"}, {"t": 0.6, "html": "   MERGED $TMPDIR/hello-party.SANDBOX/state/merged/version-flag.out"}, {"t": 0.68, "html": "   a second merge is refused: ALREADY-MERGED $TMPDIR/hello-party.SANDBOX/state/merged/version-flag.out by=worker"}, {"t": 0.68, "html": ""}, {"t": 0.68, "html": "<strong>9. The quest closes</strong>"}, {"t": 0.74, "html": "   version-flag: state=done"}, {"t": 0.75, "html": ""}, {"t": 0.75, "html": "<strong>10. The voice tells you</strong>"}, {"t": 0.75, "html": ""}, {"t": 0.75, "html": "Your quest &quot;version-flag&quot; is done."}, {"t": 0.75, "html": ""}, {"t": 0.75, "html": "  The tool now answers --version with: 0.1.0"}, {"t": 0.75, "html": "  The party made 2 commits to get there: the gate refused the first one."}, {"t": 0.75, "html": "  The result was merged once, to: $TMPDIR/hello-party.SANDBOX/state/merged/version-flag.out"}, {"t": 0.75, "html": ""}, {"t": 0.75, "html": "Nothing else on your machine was touched."}, {"t": 0.75, "html": "(sandbox removed; --keep to inspect it)"}];
const term = document.getElementById('term');
const playBtn = document.getElementById('playBtn');
const restartBtn = document.getElementById('restartBtn');
const caption = document.getElementById('caption');

let idx = 0, playing = false, timer = null, startWall = 0, startT = 0;

function render() {
  term.innerHTML = EVENTS.slice(0, idx).map(e => e.html).join('\n');
  term.scrollTop = term.scrollHeight;
  caption.textContent = idx + ' / ' + EVENTS.length + ' lines';
}

function scheduleNext() {
  if (idx >= EVENTS.length) { playing = false; playBtn.textContent = 'Play'; return; }
  const target = EVENTS[idx].t;
  const wait = Math.max(0, (target - startT) * 1000 - (performance.now() - startWall));
  timer = setTimeout(() => {
    idx += 1;
    render();
    scheduleNext();
  }, wait);
}

function play() {
  if (idx >= EVENTS.length) { idx = 0; }
  playing = true;
  playBtn.textContent = 'Pause';
  startWall = performance.now();
  startT = idx < EVENTS.length ? EVENTS[idx].t : 0;
  scheduleNext();
}

function pause() {
  playing = false;
  playBtn.textContent = 'Play';
  clearTimeout(timer);
}

playBtn.addEventListener('click', () => { playing ? pause() : play(); });
restartBtn.addEventListener('click', () => { pause(); idx = 0; render(); play(); });

render();
play();
</script>
</body>
</html>
