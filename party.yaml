# party.yaml — the roster. The ONE place names live.
#
# Everything under bus/ and lifecycle/ reads this file; no script carries its own
# copy of who the party is. Point INNKEEPER_PARTY at another file to use another
# roster (that is what the selftests do).
#
# The example below is a real four-brain party. Rename them; nothing keys on these
# strings.

party:
  name: The Example Party
  bus: ~/party-bus            # comms/ and queues/ live here

brains:                       # each owns a queue lane and can be addressed
  # recycle_after = how many REAL ticks this brain may accrue before lifecycle/ticks.sh
  # calls it due for a context recycle. A voice that answers in one line drifts slower
  # than a gate that reads whole diffs, so the number is per-brain, not per-party.
  - { name: rabbot, role: voice,      class: cleric,       model: opus,   machine: local, recycle_after: 12 }
  - { name: geist,  role: gate,       class: death-knight, model: fable,  machine: local, recycle_after: 6 }
  - { name: page,   role: worker,     class: squire,       model: sonnet, machine: local, recycle_after: 8 }
  - { name: augur,  role: researcher, class: oracle,       model: sonnet, machine: local, recycle_after: 10 }

familiars:                    # deterministic, no LLM, no lane
  - { name: watchman, role: watchman, every: 10m }
  - { name: herald,   role: herald,   channel: stdout }

# Names that may be ADDRESSED in a comm filename but own no queue lane: the human,
# a brain on another meter, a retired name still appearing mid-run. Membership here
# keeps the filename grammar parsing the whole run without ever creating a queue dir
# nothing polls.
addressees: [teague]

# Alternate spellings that resolve to a roster name — a machine name, a class name,
# an old name a sender still uses. A comm addressed to the alias reaches the brain.
aliases:
  - { from: cleric, to: rabbot }

# Where the launchers live. lifecycle/recycle.sh greps these for the flag name it is
# about to write, so a flag no launcher consumes is caught at the call site instead of
# blinding the restart path in silence. Globs, one per line; a dir that does not exist
# is skipped. In a real party this list is where a brain living in another repo gets
# added — that is the ONE line that changes, not the script.
launchers: [~/party/launchers/start-*.sh]
